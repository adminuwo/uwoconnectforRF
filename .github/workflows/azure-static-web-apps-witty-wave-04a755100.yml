name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_WAVE_04A755100 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_API_URL: https://aisaconnectback-anaqbuapb6c6apgy.centralindia-01.azurewebsites.net
          NEXT_PUBLIC_META_APP_ID: "991147863536661"
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCLdlIXdWfczEiwFtaCd3sq9jX27zUDmY0
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:876129590251:web:5b2f663407494e406a17ae"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: uwoconnect.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-3BGSZ7QLPJ
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "876129590251"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: uwoconnect
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: uwoconnect.firebasestorage.app
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 876129590251-0gr1hm1jq3ojn4bl4400nh10676h7sj4.apps.googleusercontent.com

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_WAVE_04A755100 }}
          action: "close"
