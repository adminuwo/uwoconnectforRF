name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .
        continue-on-error: true

      - name: Security scan
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCLdlIXdWfczEiwFtaCd3sq9jX27zUDmY0
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: uwoconnect.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: uwoconnect
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: uwoconnect.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "876129590251"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:876129590251:web:5b2f663407494e406a17ae"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-3BGSZ7QLPJ
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
