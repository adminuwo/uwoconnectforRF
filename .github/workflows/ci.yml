name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Security scan
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy_api_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy_auth_domain
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy_project_id
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy_storage_bucket
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: dummy_sender_id
          NEXT_PUBLIC_FIREBASE_APP_ID: dummy_app_id
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
